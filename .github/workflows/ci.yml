name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DISPOSABLE_TEST_ACK: "yes"
      DISPOSABLE_SAFETY_DIR: ${{ github.workspace }}/scripts
      DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: disposable-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: disposable-test-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Scan client bundles for service_role canaries
        run: bash scripts/scan-client-bundle-secrets.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Normalize shell script line endings
        run: |
          python scripts/normalize_shell_lf.py
          find scripts -name '*.sh' -print0 | xargs -0 sed -i 's/\r$//'
          chmod +x scripts/*.sh scripts/integration/*.sh
          if grep -r $'\r' scripts --include='*.sh'; then
            echo "::error::CRLF line endings remain in shell scripts"
            exit 1
          fi

      - name: Disposable SQL migrations and verification
        run: |
          # scripts/ci-disposable-validation.sh
          set -euxo pipefail
          for attempt in $(seq 1 60); do
            if psql -v ON_ERROR_STOP=1 -c 'select 1 as disposable_postgres_ready' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "::error::postgres not reachable at PGHOST=${PGHOST} url=${DISPOSABLE_DATABASE_URL}" >&2
              exit 2
            fi
            sleep 1
          done
          psql -v ON_ERROR_STOP=1 -c 'select 1 as disposable_postgres_ready'
          export DISPOSABLE_VALIDATION_TRACK=clean
          psql -v ON_ERROR_STOP=1 -f supabase/fixtures/disposable-test-prerequisites.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/verify/phase11_clean_install.sql || { echo "::error::verify failed phase11_clean_install.sql"; exit 3; }
          for verify in supabase/verify/*.sql; do
            if [[ "$(basename "$verify")" == "phase11_clean_install.sql" ]]; then
              continue
            fi
            psql -v ON_ERROR_STOP=1 -f "$verify" || { echo "::error::verify failed $(basename "$verify")"; exit 3; }
          done
          for integration in scripts/integration/*.sh; do
            bash "$integration" || { echo "::error::integration $(basename "$integration") failed with exit $?"; exit 12; }
          done
          psql -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname = 'postgres_legacy' and pid <> pg_backend_pid()" || true
          psql -v ON_ERROR_STOP=1 -c 'drop database if exists postgres_legacy'
          psql -v ON_ERROR_STOP=1 -c 'create database postgres_legacy template template0'
          export DISPOSABLE_VALIDATION_TRACK=legacy
          export DISPOSABLE_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres_legacy
          psql -v ON_ERROR_STOP=1 -f supabase/fixtures/disposable-test-prerequisites.sql
          psql -v ON_ERROR_STOP=1 -f supabase/legacy/fixtures/legacy-jobs-stub.sql
          psql -v ON_ERROR_STOP=1 -f supabase/legacy/migrations/20260814000000_create_job_processing_audit.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/legacy/migrations/20260910180000_lockdown_legacy_jobs.sql
          for verify in supabase/verify/*.sql; do
            if [[ "$(basename "$verify")" == "phase11_clean_install.sql" ]]; then
              continue
            fi
            psql -v ON_ERROR_STOP=1 -f "$verify"
          done
          for verify in supabase/legacy/verify/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$verify"
          done
