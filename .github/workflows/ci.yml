name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DISPOSABLE_TEST_ACK: "yes"
      DISPOSABLE_SAFETY_DIR: ${{ github.workspace }}/scripts
      DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: disposable-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: disposable-test-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Scan client bundles for service_role canaries
        run: bash scripts/scan-client-bundle-secrets.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Normalize shell script line endings
        run: |
          python scripts/normalize_shell_lf.py
          find scripts -name '*.sh' -print0 | xargs -0 sed -i 's/\r$//'
          chmod +x scripts/*.sh scripts/integration/*.sh
          if grep -r $'\r' scripts --include='*.sh'; then
            echo "::error::CRLF line endings remain in shell scripts"
            exit 1
          fi

      - name: Syntax-check shell scripts
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -name '*.sh' -print0)

      - name: Disposable SQL migrations and verification
        run: bash scripts/ci-disposable-validation.sh
